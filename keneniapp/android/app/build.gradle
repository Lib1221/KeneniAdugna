plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.keneniapp"
    compileSdk = 35 // ✅ already good, minimum required is 34
    ndkVersion = project.flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true // ✅ Desugaring enabled
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.keneniapp"
        minSdk = 23
        targetSdk = 34
        versionCode = project.flutter.versionCode
        versionName = project.flutter.versionName

        multiDexEnabled true // ✅ Enable MultiDex
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2' // ✅ Desugaring lib
    implementation 'androidx.window:window:1.0.0' // ✅ Window lib
    implementation 'androidx.window:window-java:1.0.0' // ✅ Window Java lib
}
