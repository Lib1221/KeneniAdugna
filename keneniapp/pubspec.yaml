name: keneniapp
description: "A memorial Flutter app for Keneni Adugna."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"  # Update SDK for null safety

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  photo_view: 
  flutter_staggered_grid_view: 
  video_player: 
  image_picker:
  dio: 
  # file_picker: ^10.0.0
  firebase_core: 
  cloud_firestore: 
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
