name: keneniapp
description: "A memorial Flutter app for Keneni Adugna."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"  # Update SDK for null safety

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  photo_view: 
  flutter_staggered_grid_view: 
  video_player: 
  image_picker:
  dio: 
  firebase_core: 
  cloud_firestore: 
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  flutter_native_splash:  
  flutter_launcher_icons:
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  flutter_downloader: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
flutter_native_splash:
  image: assets/a.jpg  # Path to your splash screen image
  color: "#ffffff"  # Background color of your splash screen

flutter_icons:
  android: true
  ios: true
  image_path: "assets/a.jpg"  # Path to your app icon image
  remove_alpha: true        