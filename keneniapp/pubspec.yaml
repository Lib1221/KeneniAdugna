name: keneniapp
description: "A memorial Flutter app for Keneni Adugna."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"  # Update SDK for null safety

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.9.5
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
